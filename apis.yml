aid: empowerly
name: Empowerly
description: >-
  Empowerly is an education-technology company founded in 2017 by Hanmei Wu and Changxiao Xie that
  delivers personalized college admissions and career counseling to high-school students. The
  platform pairs students with a network of more than 100 counselors — including former college
  admission officers — and layers on data-driven tooling: a proprietary admissions calculator built
  from thousands of past student outcomes, college-list building, essay editing and review, interview
  preparation, and startup and research internship placement programs. Students and families work
  through the Empowerly web portal at app.empowerly.com; counseling packages are sold through an
  enrollment conversation rather than published price tiers. Empowerly publishes no public developer
  program, API documentation, or SDKs; the only publicly callable surface on its own domains is the
  Atlassian-hosted status page API at status.empowerly.com.
