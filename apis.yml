apis:
- name: Empowerly Status API
  description: >-
    Read-only, unauthenticated JSON status API served from Empowerly's own status subdomain by
    Atlassian Statuspage. Exposes the overall page status indicator, the component roster (currently
    a single "Empowerly Web Portal" component), incident history, and scheduled maintenance windows,
    plus RSS and Atom history feeds. This is a platform-provided surface rather than a first-party
    Empowerly product API — Empowerly operates the page and its content, Atlassian defines the
    contract.
  humanURL: https://status.empowerly.com/
  baseURL: https://status.empowerly.com/api/v2
